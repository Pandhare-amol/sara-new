# Public installer for sharing Sara (npm run dist:public).
#
# Differences from electron-builder.yml (the owner's personal build):
#  - No bundled character model. The included models' licences forbid
#    redistribution ("请勿二次配布"), so each user imports their own MMD
#    character on first run (the app shows an "Import my character" screen).
#  - Built with VITE_SARA_PUBLIC=1 so the app expects that.
# API keys and personal data are never packaged by either build: they live in
# %APPDATA%\Sara on each PC (keys DPAPI-encrypted per Windows user), and
# .env / local data folders are not in `files`.
appId: com.myraa.desktop
productName: Sara
copyright: Copyright © 2026 Sara
afterPack: electron/afterPack.cjs

directories:
  output: release-public
  buildResources: build

asar: false

files:
  - electron/**/*
  - dist/**/*
  - assets/**/*
  - "!assets/characters/**"
  - build/icon.png
  - build/icon.ico
  - package.json
  - "!**/.env*"

extraResources:
  - from: agent_dist/sara-agent
    to: agent
    filter: ["**/*"]
  - from: sara-windows/native/WindowsBridge/publish
    to: sara-windows-bridge
    filter: ["**/*"]
  - from: sara-windows/native/DesktopHost/publish
    to: sara-desktop-host
    filter: ["**/*"]
  - from: "assets/core ui/desktop-host/dotnet/SaraLiveCoreHost/publish"
    to: sara-live-core-host
    filter: ["**/*"]

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Sara
  artifactName: ${productName}-Setup-${version}.${ext}

portable:
  artifactName: ${productName}-Portable-${version}.${ext}
